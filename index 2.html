<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>まるごと予定</title>
<style>
:root{--bg:#fbfcfd;--card:#fff;--text:#1c2430;--sub:#667085;--line:#e3e7ee;--ac:#1f5fd1;--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:17px/1.5 "Noto Sans JP","Hiragino Sans","Meiryo",sans-serif;padding-bottom:24px}
main{max-width:560px;margin:0 auto;padding:14px 14px 8px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
input,select{width:100%;min-height:48px;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:#fff;font-size:17px}
input[type=checkbox]{width:28px;min-height:28px;height:28px;accent-color:var(--ac);flex:none}
h3{font-size:16px;color:var(--sub);margin:20px 0 8px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.nav{min-height:48px;min-width:88px;padding:8px 12px;border:1px solid var(--line);background:#fff;color:var(--sub);border-radius:var(--r);font-size:16px}
.date{text-align:center;flex:1}
.date b{display:block;font-size:26px;line-height:1.25}
.date span{font-size:15px;color:var(--sub)}
.quiz{background:#eef3fd;color:#163a7a;border-radius:var(--r);padding:14px 16px;margin-bottom:6px}
.quiz small{font-size:15px}
.quiz b{display:block;font-size:22px;margin:2px 0 8px}
.list{list-style:none;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list>li,.list>label{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:56px;border-bottom:1px solid var(--line)}
.list>:last-child{border-bottom:0}
.no{width:32px;height:32px;border-radius:8px;background:#eef3fd;color:var(--ac);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.name{flex:1;font-weight:500;min-width:0;overflow-wrap:anywhere}
.sub{color:var(--sub);font-size:15px}
.badge{font-size:15px;font-weight:700;padding:3px 10px;border-radius:99px;flex:none;background:#eef3fd;color:var(--ac)}
.b部活{background:#fff1d6;color:#8a5200}.b習い事{background:#e6f5ec;color:#17683a}.b自分{background:#f1ecfb;color:#5b3aa6}.b補講{background:#fde8e8;color:#a32020}
.chk input:checked+span{text-decoration:line-through;color:var(--sub)}
.btn{display:block;width:100%;min-height:52px;margin-top:10px;padding:10px;font-weight:700;border-radius:var(--r);border:2px solid var(--ac);background:var(--ac);color:#fff}
.btn.line{background:transparent;color:var(--ac);border-style:dashed}
.del{min-height:44px;min-width:60px;border:1px solid var(--line);background:#fff;border-radius:var(--r);color:#a32020;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{min-height:46px;padding:8px 14px;border:1px solid var(--line);background:#fff;border-radius:99px;font-size:16px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
.field{margin-bottom:10px}.field label{display:block;font-size:15px;color:var(--sub);margin-bottom:4px}
.fld{display:grid;gap:10px;margin-bottom:10px}
.days{display:flex;flex-wrap:wrap;gap:8px}
.days label{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:99px;background:#fff}
.day{display:block;width:100%;text-align:left;padding:12px 14px;min-height:64px;background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
.day.now{border:2px solid var(--ac)}
.day b{font-size:18px}.day p{font-size:15px;color:var(--sub);overflow-wrap:anywhere}
.empty{padding:16px;color:var(--sub);background:#fff;border:1px dashed var(--line);border-radius:var(--r)}
nav.tabs{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav.tabs div{max-width:560px;margin:0 auto;display:flex}
nav.tabs button{flex:1;min-height:56px;border:0;background:transparent;font-size:17px;color:var(--sub);font-weight:500}
nav.tabs button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 -4px 0 var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:10px}
.cal .h{text-align:center;font-size:15px;color:var(--sub);padding:4px 0}
.cd{min-height:58px;padding:4px 0;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:center;font-size:17px}
.cd.t{background:#fff1d6}.cd.off b{color:#c0262d}.cd.dim{visibility:hidden}
.dots{display:flex;justify-content:center;flex-wrap:wrap;gap:3px;margin-top:3px;min-height:10px}
.dot{width:9px;height:9px;border-radius:50%}
.dc部活{background:#f0a21a}.dc習い事{background:#2f9e5f}.dc自分{background:#7a55d6}.dc行事{background:#e8590c}.dc休み{background:#c0262d}
.b行事{background:#ffe8d6;color:#a34200}.b休み{background:#fde8e8;color:#a32020}.bテスト{background:#fff1d6;color:#8a5200}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:15px;color:var(--sub);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.bub{padding:10px 14px;border-radius:16px;margin-bottom:8px;max-width:88%;overflow-wrap:anywhere;font-size:16px;white-space:pre-wrap}
.bub.me{background:var(--ac);color:#fff;margin-left:auto}.bub.ai{background:#eef0f4}
.cd{min-height:62px}.cd.hol{background:#fde8e8}.cd.evt{background:#ffe8d6}.cd.t{background:#fff1d6}.cd.sel{border:2px solid var(--text)}
.cd.now b{background:var(--ac);color:#fff;border-radius:50%;width:32px;height:32px;display:inline-grid;place-items:center}
.dc変更{background:#1f5fd1}
.dp{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.dp>b{font-size:18px}
</style>
</head>
<body>
<nav class="tabs"><div id="tabs"></div></nav>
<main id="app"></main>
<script>
var smp=null,photoOk=false,ph={log:[],turns:[],items:null,file:null,busy:false};

var st=load(),view="today",rs="tt",rd=1,cur=defKey(),mo=key(new Date()).slice(0,7),rvd=cur,saveOk=true,ovs="c",calSel=key(new Date());
var SU="https://iafjdksftyzcwbjpsufa.supabase.co",SK="sb_publishable_W3Z6W6--gCpd5xuEYVAypA_ga52TMrO",AK="marugoto-auth-1",au=null,cs="",pt=null,pulled=false;
function jwt(t){try{return JSON.parse(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")))}catch(e){return null}}
function loadAuth(){try{au=JSON.parse(localStorage.getItem(AK)||"null")}catch(e){au=null}}

async function api(path,opt){var t=await tok();if(!t)throw 0;opt=opt||{};opt.headers=Object.assign({apikey:SK,Authorization:"Bearer "+t,"Content-Type":"application/json"},opt.headers||{});var r=await fetch(SU+"/rest/v1/"+path,opt);if(!r.ok)throw r.status;return r}
function hasLocal(){return Object.keys(st.tt).length||st.acts.length||st.mine.length||st.ev.length||st.tests.length||Object.keys(st.ov).length}

    if(use){st=Object.assign(def(),j[0].data);st.acts.forEach(function(a){if(!a.id)a.id=nid()});try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}cs="保存済み";pulled=true;render();return}}
  pulled=true;await push();render()}catch(e){cs="読み込めませんでした。ネットを確認してください";render()}}
async function push(){if(!au||!pulled)return;stat("保存中…");try{await api("user_state?on_conflict=user_id",{method:"POST",headers:{Prefer:"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({user_id:au.sub,data:st,updated_at:new Date().toISOString()})});stat("保存済み")}catch(e){stat("保存できませんでした")}}

function authBar(){if(au)return'<div class="dp" style="display:flex;align-items:center;gap:10px;padding:8px 12px"><span class="sub" style="flex:1;overflow-wrap:anywhere">ログイン中：'+e(au.email||"")+'<br><span id="cs">'+e(cs)+'</span></span><button class="del" data-a="logout">ログアウト</button></div>';return'<div class="dp"><div class="sub" style="margin-bottom:8px">ログインすると、予定が消えず、別の端末でも使えます。'+(cs?'<br>'+e(cs):'')+'</div><button class="btn" style="margin:0" data-a="login">Googleでログイン</button></div>'}
function def(){return{tt:{},quiz:{},items:{},acts:[],mine:[],ov:{},memo:{},chk:{},xi:{},ev:[],tests:[],hw:{},hwd:{},teachers:[]}}
function nid(){return "a"+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function load(){var d;try{d=Object.assign(def(),JSON.parse(localStorage.getItem(K)||"{}"))}catch(e){d=def()}d.acts.forEach(function(a){if(!a.id)a.id=nid()});return d}

function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function defKey(){var n=new Date();if(n.getHours()>=16)n.setDate(n.getDate()+1);return key(n)}

  var w=pd(k).getDay(),o=st.ov[k]||{},b=st.tt[w]||[],c=o.c||{},ls=[];
  for(var i=0;i<7;i++){var v=(i in c)?c[i]:(b[i]||"");if(v&&v!=="なし")ls.push({i:i,n:v})}

}

function today(){

  x.x.forEach(function(n){r+='<li><span class="badge b補講">補講</span><span class="name">'+e(n)+'</span></li>'});

function dayPanel(k){

function week(){

function chips(arr,cur2,a){return'<div class="chips">'+arr.map(function(c){return'<button class="chip'+(c[0]===cur2?" on":"")+'" data-a="'+a+'" data-v="'+c[0]+'">'+c[1]+'</button>'}).join("")+'</div>'}
function reg(){
  var h=chips([["tt","時間割"],["tc","担当者"],["it","持ち物"],["hw","宿題"],["ac","部活・習い事"],["ts","テスト期間"],["ph","写真で変更"],["ov","その日だけ変更"],["ev","行事・代休"],["mi","自分の予定"]].filter(function(c){return c[0]!=="ph"||photoOk}),rs,"rs");

function parseItems(r){
  var ok=function(d){return typeof d==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(pd(d).getTime())},sj=function(v){return typeof v==="string"&&v.trim()&&v.length<=20?v.trim():null},its=[];
  ((r&&r.changes)||[]).forEach(function(c){var p=+c.period;if(ok(c.date)&&p>=1&&p<=7&&sj(c.subject))its.push({k:"c",date:c.date,p:p,s:sj(c.subject)})});
  ((r&&r.extra)||[]).forEach(function(c){if(ok(c.date)&&sj(c.subject)&&c.subject!=="なし")its.push({k:"x",date:c.date,s:sj(c.subject)})});
  ((r&&r.quiz)||[]).forEach(function(c){if(ok(c.date)&&sj(c.subject))its.push({k:"q",date:c.date,s:sj(c.subject)})});
  return its
}

  var opt={cache:false};if(ph.file)opt.images=[ph.file];
  Promise.resolve(smp.json([{role:"user",content:sysText()}].concat(ph.turns),opt)).then(function(r){
    ph.items=parseItems(r);
    var rp=(r&&typeof r.reply==="string"&&r.reply.trim())?r.reply.trim().slice(0,400):(ph.items.length?"次のように読み取りました。":"変更は読み取れませんでした。");
    ph.log.push({w:"ai",t:rp});ph.turns.push({role:"assistant",content:JSON.stringify(r||{})});ph.busy=false;render()
  }).catch(function(er){
    ph.turns.pop();ph.log.push({w:"ai",t:er&&er.code==="not_granted"?"AIの利用が許可されなかったので、答えられません。":"うまく読み取れませんでした。もう一度送るか、手で入れてください。"});ph.busy=false;render()

}
